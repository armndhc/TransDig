<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galería con Carrusel</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        /* Barra superior estilo de tu imagen */
        .header {
            background-color: #8b1e2d;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        /* Botones verdes */
        .btn-custom {
            background-color: #28a745;
            color: white;
        }

        .btn-custom:hover {
            background-color: #218838;
        }

        /* Cards */
        .card {
            border-radius: 10px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
        }

        .card img {
            height: 200px;
            object-fit: cover;
        }

        /* Carrusel */
        .carousel video {
            height: 400px;
            object-fit: cover;
            width: 100%;
        }

        @media (max-width: 768px) {
            .carousel video {
                height: 250px;
            }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    Mi Plataforma de Contenido
</div>

<!-- ?? CARRUSEL DE VIDEOS -->
<div id="carouselVideos" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

        <div class="carousel-item active">
            <video autoplay muted loop>
                <source src="video1.mp4" type="video/mp4">
            </video>
        </div>

        <div class="carousel-item">
            <video autoplay muted loop>
                <source src="video2.mp4" type="video/mp4">
            </video>
        </div>

        <div class="carousel-item">
            <video autoplay muted loop>
                <source src="video3.mp4" type="video/mp4">
            </video>
        </div>

    </div>

    <!-- Controles -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselVideos" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#carouselVideos" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
</div>

<!-- ??? GALERÍA -->
<div class="container mt-5">
    <div class="row g-4">

        <!-- CARD 1 -->
        <div class="col-md-4 col-sm-6">
            <div class="card">
                <img src="img1.jpg" class="card-img-top" alt="Imagen 1">
                <div class="card-body text-center">
                    <h5 class="card-title">Elemento 1</h5>

                    <!-- OPCIÓN 1: IR A OTRA PÁGINA -->
                    <a href="detalle.html" class="btn btn-custom">Ver más</a>

                    <!-- OPCIÓN 2: MODAL -->
                    <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modal1">
                        Ver imagen
                    </button>
                </div>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="col-md-4 col-sm-6">
            <div class="card">
                <img src="img2.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5 class="card-title">Elemento 2</h5>
                    <a href="#" class="btn btn-custom">Ver más</a>
                </div>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="col-md-4 col-sm-6">
            <div class="card">
                <img src="img3.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5 class="card-title">Elemento 3</h5>
                    <a href="#" class="btn btn-custom">Ver más</a>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- ?? MODAL (IMAGEN GRANDE) -->
<div class="modal fade" id="modal1" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center">
                <img src="img1.jpg" class="img-fluid">
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
