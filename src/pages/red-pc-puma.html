<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Red PC Puma</title>
    <link rel="stylesheet" href="../css/cursos.css">
    <link rel="stylesheet" href="../css/slider.css">
    <link rel="stylesheet" href="../css/pc-puma.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css"> 

</head>
<body>
    <!--Escudos /script/components/header-->
    <!--Barra de Navegación /script/components/navbar-->
    <navbar-component></navbar-component>

    <div class="content">
        <div class="separador gradiente">
            <h2>Un día en la Facultad de Ingeniería</h2>
        </div>

    <div class="carousel-container-pc">
        <div class="carousel">
            <div class="carousel-item">
                <video muted>
                    <source src="../videos/Norte.mp4" type="video/mp4">
                </video>
            </div>
            <div class="carousel-item">
                <video muted>
                    <source src="../videos/Sur.mp4" type="video/mp4">
                </video>
            </div>
            <div class="carousel-item">
                <video muted>
                    <source src="../videos/Posgrado.mp4" type="video/mp4">
                </video>
            </div>
        </div>
        <button class="carousel-button prev" id="prev">❮</button>
        <button class="carousel-button next" id="next">❯</button>
        </div>

        <div class="separador gradiente">
            <h2>¡Lo que no conocías de PC-PUMA!!!!</h2>
        </div>
        <div class="pinterest-gallery">
            <div class="gallery-item">
                <div class="gallery-caption-box">
                    <span class="gallery-caption">Transferencia de datos</span>
                </div>
                <img src="../images/pcpuma/Transferencia de datos.jpg" onclick="openModal(this)">
            </div>
            <div class="gallery-item">
                <div class="gallery-caption-box">
                    <span class="gallery-caption">Servicios</span>
                </div>
                <img src="../images/pcpuma/Servicios.jpg" onclick="openModal(this)">
            </div>
            <div class="gallery-item">
                <div class="gallery-caption-box">
                    <span class="gallery-caption">Uso de la red</span>
                </div>
                <img src="../images/pcpuma/Uso de Red.jpg" onclick="openModal(this)">
            </div>
            <div class="gallery-item">
                <div class="gallery-caption-box">
                    <span class="gallery-caption">Estatus de Cliente</span>
                </div>
                <img src="../images/pcpuma/Estatus Cliente.jpg" onclick="openModal(this)">
            </div>

            <!-- Modal for enlarged image -->
            <div id="imgModal" class="modal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
                <img id="modalImg" style="max-width:90vw; max-height:80vh; display:block; margin:auto;">
                <div id="modalCaption" style="color:white;text-align:center;margin-top:10px;"></div>
            </div>
            <script>
            function openModal(img) {
                var modal = document.getElementById('imgModal');
                var modalImg = document.getElementById('modalImg');
                var caption = document.getElementById('modalCaption');
                modal.style.display = 'flex';
                modalImg.src = img.src;
                caption.textContent = img.alt;
            }
            function closeModal() {
                document.getElementById('imgModal').style.display = 'none';
            }

            // Cerrar modal al hacer clic fuera de la imagen
            document.addEventListener('DOMContentLoaded', function() {
                var modal = document.getElementById('imgModal');
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        closeModal();
                    }
                });
            });
            </script>
        </div>
        </div>
        <!-- Inicio de Historico -->
        <div class="content"></div>
         <div class="separador gradiente">
              <h2>Historico de estadisticas de uso de la red</h2>
          </div>

          <section class="course-section">
            <div class="container">
                <div id="courseList" class="course-grid">
                    <!-- Las tarjetas de cursos se generarán aquí dinámicamente -->
                </div>
            </div>
          </section>
        </div>
      <!-- Fin de Historico -->
    </div>

    <!--Escudos /script/components/footer-->
    <footer-component></footer-component>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="../script/historicos.js"></script>
    <script src="../script/components/navbar.js"></script>
    <script src="../script/components/footer.js"></script>
    <script src="../script/index-script.js"></script>
    <script src="../script/pcpuma.js"></script>
        
</body>
</html>
